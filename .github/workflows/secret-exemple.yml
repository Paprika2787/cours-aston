name: Utilisation des GitHub Secrets

# 🎯 Déclenchement manuel ou à chaque push sur main
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 🏗️ Définition des tâches (jobs)
jobs:
  secure-api-call:
    runs-on: ubuntu-latest # Exécute sur une machine Linux GitHub
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4 # Récupère le code source du projet

      - name: 🔐 Utiliser une clé API sécurisée
        env:
          API_KEY: ${{ secrets.DEVOPS }}
        run: |
          echo "La clé API est bien définie"
          echo "Longueur de la clé : ${#API_KEY}"
        # Ne jamais afficher la valeur brute du secret dans les logs
        # 💡 Explication :
# Les GitHub Secrets servent à stocker des informations sensibles comme des tokens,
# des clés API ou des mots de passe sans les exposer dans le code ou dans les logs.
# Dans ce workflow, la valeur du secret est injectée dans la variable API_KEY
# au moment de l'exécution, puis utilisée sans l'afficher en clair.
# Pour l'utiliser, il faut d'abord créer le secret dans GitHub :
# Settings > Secrets and variables > Actions > New repository secret.
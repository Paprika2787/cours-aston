# 📋 Nom du workflow
name: Génération d'Image via IA et Déploiement GitHub Pages

# 🚀 Déclenchement à chaque push sur main
on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet un déclenchement manuel

# 🛠️ Définition des jobs
jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Cloner le dépôt GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour récupérer l'historique des commits

      - name: 📝 Récupérer le message du dernier commit
        id: commit_message
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: 📁 Créer le dossier images
        run: mkdir -p images

      - name: 🎨 Générer l'image via l'API DynaPictures
        env:
          DYNAPICTURES_API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.message }}
        run: |
          RESPONSE=$(curl -s -X POST "https://api.dynapictures.com/templates/YOUR_TEMPLATE_ID/renders" \
            -H "Authorization: Bearer $DYNAPICTURES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"data\": {
                \"text\": {
                  \"text\": \"$COMMIT_MESSAGE\"
                }
              }
            }")
          echo "Réponse API : $RESPONSE"
          IMAGE_URL=$(echo $RESPONSE | grep -o '"url":"[^"]*' | cut -d'"' -f4)
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: 📥 Télécharger l'image générée
        run: |
          TIMESTAMP=$(date +%s)
          curl -s "$IMAGE_URL" -o "images/image-$TIMESTAMP.png"
          echo "IMAGE_FILE=image-$TIMESTAMP.png" >> $GITHUB_ENV

      - name: 🌐 Générer le fichier index.html
        run: |
          echo "<html><head><title>Galerie d'Images générées</title></head><body>" > images/index.html
          echo "<h1>🎨 Images générées par les commits</h1>" >> images/index.html
          for img in images/*.png; do
            filename=$(basename "$img")
            echo "<div><img src='$filename' width='300'/><p>$filename</p></div>" >> images/index.html
          done
          echo "</body></html>" >> images/index.html

      - name: 📤 Commit et push des nouvelles images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "🎨 Ajout de l'image générée pour le commit : ${{ steps.commit_message.outputs.message }}" || echo "Rien à committer"
          git push

      - name: 🚀 Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images
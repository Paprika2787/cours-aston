# 🏷️ Nom du workflow
name: Génération d'Image via IA et Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: git-push-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le dépôt GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupérer le message du dernier commit
        id: commit_message
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Créer le dossier images
        run: mkdir -p images

      - name: 🎨 Générer l'image via l'API DynaPictures
        env:
          COMMIT_MESSAGE: ${{ steps.commit_message.outputs.message }}
        run: |
          PAYLOAD=$(jq -n --arg text "$COMMIT_MESSAGE" '{
            "format": "jpeg",
            "params": [
              { "name": "heading", "text": $text }
            ]
          }')

          RESPONSE=$(curl -s -X POST "https://api.dynapictures.com/designs/c48dbce23a" \
            -H "Authorization: Bearer ${{ secrets.DYNAPICTURES_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Réponse API : $RESPONSE"
          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.imageUrl')
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV

      - name: Télécharger l'image générée
        run: |
          echo "URL récupérée : $IMAGE_URL"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          curl -s "$IMAGE_URL" -o "images/${SHORT_SHA}.png"

      - name: Générer le fichier index.html
        run: |
          echo "<html><head><title>Galerie d'Images générées</title></head><body>" > index.html
          echo "<h1>Images générées par les commits</h1>" >> index.html
          for img in images/*.png; do
            filename=$(basename "$img")
            echo "<div><img src='images/$filename' width='300'/><p>$filename</p></div>" >> index.html
          done
          echo "</body></html>" >> index.html

      - name: Commit et push des images et de l'index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Ajout image + mise à jour galerie pour commit ${{ github.sha }}" || echo "Rien à committer"

          # Tente le push, et si ça échoue, rebase puis réessaie
          git pull --rebase origin main
          git push origin main || (git pull --rebase origin main && git push origin main)
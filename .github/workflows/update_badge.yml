name: Mise à jour du badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"  # Met à jour chaque heure

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Compter le nombre de commits
        id: commit_count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour le badge
        run: |
          mkdir -p badges
          echo '{
            "schemaVersion": 1,
            "label": "Commits",
            "message": "'${{ steps.commit_count.outputs.count }}'",
            "color": "blue"
          }' > badges/badge.json

      - name: Commit et push les modifications
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add badges/badge.json
          git commit -m "Mise à jour automatique du badge" || echo "Rien à committer"
          git push
# Nom du workflow
name: Mise à jour du badge

# Déclencheurs
on:
  push:
    branches: [main]
    paths-ignore:
      - 'badges/**'          # évite que le workflow se relance sur son propre commit
  schedule:
    - cron: "0 * * * *"      # toutes les heures (UTC)
  workflow_dispatch:         # bouton manuel, pratique pour tester

concurrency:
  group: git-push-main
  cancel-in-progress: false

# Le workflow doit ÉCRIRE dans le dépôt (commit + push)
permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compter le nombre de commits
        id: compte
        run: echo "total=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour le fichier du badge
        env:
          TOTAL: ${{ steps.compte.outputs.total }}
        run: |
          mkdir -p badges
          jq -n --arg total "$TOTAL" '{
            schemaVersion: 1,
            label: "Commits",
            message: $total,
            color: "blue"
          }' > badges/badge.json
          cat badges/badge.json

      - name: Committer et pousser (seulement si ça a changé)
        env:
          TOTAL: ${{ steps.compte.outputs.total }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- badges/badge.json; then
            echo "Badge déjà à jour, rien à pousser."
            exit 0
          fi

          git add badges/badge.json
          git commit -m "chore: mise à jour automatique du badge [skip ci]"
          git pull --rebase origin main
          git push
          echo "Badge mis à jour : $TOTAL commits"

      - name: Commit et push des images et de l'index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Ajout image + mise à jour galerie pour commit ${{ github.sha }}" || echo "Rien à committer"
          git pull --rebase origin main
          git push origin main
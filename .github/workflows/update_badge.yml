name: Mise à jour du badge

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 * * * *"  # Met à jour chaque heure

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Compter le nombre de commits
        id: commit_count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mettre à jour le badge
        run: |
          mkdir -p badges
          echo '{
            "schemaVersion": 1,
            "label": "Commits",
            "message": "'${{ steps.commit_count.outputs.count }}'",
            "color": "blue"
          }' > badges/badge.json

      - name: Commit et push des images et de l'index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Ajout image + mise à jour galerie pour commit ${{ github.sha }}" || echo "Rien à committer"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            echo "Push échoué, nouvelle tentative..."
            sleep 5
          done